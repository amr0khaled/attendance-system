name: Linux App

on:
  push:
    paths:
      - 'flutter_app/**'
      - 'static/**'
      - 'app.py'
      - 'state.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/linux-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  KEEP_RELEASES: '5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # ---- Dependencies ------------------------------------------------------
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zenity

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ---- Assets & Tests ----------------------------------------------------
      - name: Bundle student/admin pages from static/
        run: |
          echo "=== Running sync_static.sh ==="
          flutter_app/tool/sync_static.sh
          ls -la flutter_app/assets/web/

      - name: Test
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Parity tests (Python server vs Dart server)
        run: |
          python -m pip install --quiet -r requirements.txt
          PYTHON=python DART=dart tests/parity.sh

      # ---- cloudflared for Linux ---------------------------------------------
      - name: Resolve latest cloudflared release
        id: cf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R cloudflare/cloudflared --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cloudflared release tag: $tag"
          mkdir -p flutter_app/build/linux/x64/release
          gh release download "$tag" -R cloudflare/cloudflared \
            -p "cloudflared-linux-amd64" \
            -O flutter_app/build/linux/x64/release/cloudflared
          chmod +x flutter_app/build/linux/x64/release/cloudflared
          ls -la flutter_app/build/linux/x64/release/cloudflared

      # ---- Build & Diagnostic Logging ----------------------------------------
      - name: Build Linux app (verbose)
        working-directory: flutter_app
        run: |
          flutter build linux --release -v

      - name: Debug inspect build bundle
        working-directory: flutter_app
        run: |
          echo "=== Bundle files ==="
          ls -la build/linux/x64/release/bundle/
          echo "=== Bundle lib/ files ==="
          ls -la build/linux/x64/release/bundle/lib/
          echo "=== Verify libcloudflared.so ==="
          file build/linux/x64/release/bundle/lib/libcloudflared.so
          build/linux/x64/release/bundle/lib/libcloudflared.so --version
          echo "=== Verify attendance_host binary ==="
          file build/linux/x64/release/bundle/attendance_host

      - name: Package release archive
        working-directory: flutter_app
        run: |
          tar -czvf "$GITHUB_WORKSPACE/attendance-host-linux-x64-${{ github.run_number }}.tar.gz" \
            -C build/linux/x64/release/bundle .
          echo "=== Archive info ==="
          ls -lh "$GITHUB_WORKSPACE/attendance-host-linux-x64-${{ github.run_number }}.tar.gz"

      # ---- Publish -----------------------------------------------------------
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="linux-build-${{ github.run_number }}"
          short=$(git rev-parse --short HEAD)
          gh release create "$tag" "attendance-host-linux-x64-${{ github.run_number }}.tar.gz" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Attendance Host Linux build ${{ github.run_number }}" \
            --notes "Branch \`${GITHUB_REF_NAME}\` @ \`$short\`, cloudflared ${{ steps.cf.outputs.tag }}."

      - name: Keep only latest ${{ env.KEEP_RELEASES }} builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("linux-build-"))] | sort_by(.createdAt) | reverse | .[].tagName' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
